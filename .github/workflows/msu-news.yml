name: MSU News Engine
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: msu-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
      with:
        ref: main
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: pip install requests feedparser beautifulsoup4 "selectolax<1" googlenewsdecoder==0.2.1
    - name: MSU News Engine
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        GOOGLE_ALERTS_RSS_URLS: ${{ secrets.GOOGLE_ALERTS_RSS_URLS }}
      run: |
        python msu_news.py
    - name: Save published history
      if: always()
      run: |
        git config user.name "MSU News Engine"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        for file in published.json published_topics.json news_control.json recent_titles.json; do
          if [ -f "$file" ]; then git add "$file"; fi
        done
        if ! git diff --cached --quiet; then
          git commit -m "Update news history"
          git pull --rebase origin main
          git push origin main
        fi
