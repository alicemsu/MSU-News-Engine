name: MSU News Engine

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: msu-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests feedparser beautifulsoup4 "selectolax<1" googlenewsdecoder==0.2.1
      - name: MSU News Engine
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python <<'PY'
          import os
          import re
          import json
          import time
          import hashlib
          import calendar
          import requests
          import feedparser

          from pathlib import Path
          from bs4 import BeautifulSoup
          from urllib.parse import urlencode, urljoin, urlsplit, urlunsplit, parse_qsl
          from googlenewsdecoder import gnewsdecoder

          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          if not webhook:
              raise SystemExit("Missing Discord secret")

          state = Path("published.json")
          seen = set(json.loads(state.read_text())) if state.exists() else set()
          limit = 3
          max_attempts = 10

          session = requests.Session()
          session.headers["User-Agent"] = "MSU-News-Engine/1.1"

          keywords = [
              "metal slug", "neo geo", "neogeo",
              "fbneo", "finalburn neo", "fightcade",
              "snk", "メタルスラッグ", "合金弹头",
              "合金彈頭", "메탈슬러그", "메탈 슬러그"
          ]

          feeds = [
              ("Gematsu", "https://www.gematsu.com/feed", False),
              ("Time Extension", "https://www.timeextension.com/feeds/news", False)
          ]

          searches = [
              ('"Metal Slug" OR "Neo Geo" OR "Fightcade" OR "FBNeo"', "en-US", "US", "US:en"),
              ('"Metal Slug" OR "Neo Geo"', "es-419", "MX", "MX:es-419"),
              ('"メタルスラッグ"', "ja", "JP", "JP:ja"),
              ('"合金弹头" OR "合金彈頭"', "zh-TW", "TW", "TW:zh-Hant"),
              ('"메탈슬러그" OR "메탈 슬러그"', "ko", "KR", "KR:ko")
          ]

          for query, hl, gl, ceid in searches:
              url = "https://news.google.com/rss/search?" + urlencode({
                  "q": "(" + query + ") when:2d",
                  "hl": hl,
                  "gl": gl,
                  "ceid": ceid
              })
              feeds.append(("Google News", url, True))

          def clean(value):
              return BeautifulSoup(value or "", "html.parser").get_text(" ", strip=True)

          def fingerprint(value):
              value = re.sub(r"[^\w]+", "", value.casefold())
              return hashlib.sha256(value.encode()).hexdigest()

          def is_google(url):
              return (urlsplit(url).hostname or "").lower() == "news.google.com"

          def public_url(url):
              p = urlsplit(url)
              return p.scheme in ("http", "https") and bool(p.hostname) and not p.username and not p.password

          def canonical(url):
              p = urlsplit(url)
              query = urlencode([(k, v) for k, v in parse_qsl(p.query, keep_blank_values=True)
                                 if not k.lower().startswith("utm_") and k.lower() not in ("fbclid", "gclid")])
              return urlunsplit((p.scheme, p.netloc.lower(), p.path.rstrip("/"), query, ""))

          def useful_summary(summary, title, publisher):
              a, b = fingerprint(summary), fingerprint(title)
              normalized = re.sub(r"[^\w]+", "", summary.casefold())
              headline = re.sub(r"[^\w]+", "", title.casefold())
              source = re.sub(r"[^\w]+", "", publisher.casefold())
              return len(summary) >= 30 and a != b and normalized not in (headline + source, source + headline)

          def topic_key(title, summary):
              t = (title + " " + summary).casefold()
              if any(x in t for x in ("metal slug", "メタルスラッグ", "合金弹头", "合金彈頭", "메탈슬러그", "메탈 슬러그")):
                  if any(x in t for x in ("movie", "film", "película", "pelicula", "映画", "电影", "電影", "영화", "live-action", "live action")):
                      if any(x in t for x in ("morosini", "guionista", "screenwriter", "scriptwriter", "the arena", "脚本", "编剧", "編劇", "각본")):
                          return "metal-slug-movie-writer"
              return ""

          topic_state = Path("published_topics.json")
          topics = json.loads(topic_state.read_text()) if topic_state.exists() else {}
          topics = {k: v for k, v in topics.items() if time.time() - v < 172800}

          def metadata(url):
              response = session.get(url, timeout=15)
              response.raise_for_status()
              soup = BeautifulSoup(response.text, "html.parser")

              def meta(*keys):
                  for key in keys:
                      tag = soup.find("meta", attrs={"property": key})
                      if not tag:
                          tag = soup.find("meta", attrs={"name": key})
                      if tag and tag.get("content"):
                          return tag["content"]
                  return ""

              image = meta("og:image:secure_url", "og:image", "twitter:image", "twitter:image:src")
              if not image:
                  tag = soup.find("link", rel="image_src")
                  image = tag.get("href", "") if tag else ""
              description = meta("og:description", "description", "twitter:description")
              if not description:
                  article = soup.find("article")
                  if article:
                      description = next((p.get_text(" ", strip=True) for p in article.find_all("p") if len(p.get_text(" ", strip=True)) >= 80), "")
              return (
                  meta("og:title", "twitter:title"),
                  description,
                  urljoin(response.url, image) if image else ""
              )

          candidates = []

          for source, url, google in feeds:
              try:
                  response = session.get(url, timeout=20)

                  if response.status_code == 429:
                      print("Rate limit:", source)
                      if google:
                          break
                      continue

                  response.raise_for_status()
                  feed = feedparser.parse(response.content)

                  for entry in feed.entries:
                      title = clean(entry.get("title", ""))
                      link = entry.get("link", "")
                      summary = clean(entry.get("summary", ""))

                      if not title or not link.startswith(("https://", "http://")):
                          continue

                      if not google and not any(
                          k in (title + " " + summary).casefold()
                          for k in keywords
                      ):
                          continue

                      published = entry.get("published_parsed") or entry.get("updated_parsed")
                      stamp = calendar.timegm(published) if published else 0

                      if not stamp or time.time() - stamp > 172800:
                          continue

                      publisher = entry.get("source", {}).get("title", source)
                      if google and title.endswith(" - " + publisher):
                          title = title[:-(len(publisher) + 3)]

                      key = fingerprint(title)
                      if key in seen:
                          continue

                      rss_image = ""
                      if not google:
                          for media in entry.get("media_content", []) + entry.get("media_thumbnail", []):
                              if media.get("url") and media.get("medium", "image") == "image" and (not media.get("type") or media["type"].startswith("image/")):
                                  rss_image = urljoin(link, media["url"])
                                  break
                      candidates.append((stamp, google, title, link, summary, publisher, key, rss_image))

              except Exception as error:
                  print("Feed error:", source, type(error).__name__)

              time.sleep(3)

          candidates.sort(key=lambda x: (not x[1], x[0]), reverse=True)
          sent = 0
          attempts = 0

          for stamp, google, title, link, summary, publisher, key, rss_image in candidates:
              if sent >= limit or attempts >= max_attempts:
                  break

              if key in seen:
                  continue

              topic = topic_key(title, summary)
              if topic and topic in topics:
                  print("Skip similar event:", topic)
                  continue
              attempts += 1
              original = link
              image = rss_image
              try:
                  if google:
                      decoded = gnewsdecoder(link, interval=2, timeout=12)
                      resolved = decoded.get("decoded_url", "")
                      if not (decoded.get("success") or decoded.get("status")) or not resolved or not public_url(resolved) or is_google(resolved):
                          print("Decode failed:", publisher, str(decoded.get("message", "unknown"))[:180])
                          if "429" in str(decoded.get("message", "")):
                              break
                          continue
                      original = resolved
                      print("Decoded:", publisher)
                  if not public_url(original):
                      continue
                  new_title, description, page_image = metadata(original)
                  title = clean(new_title) or title
                  if useful_summary(clean(description), title, publisher):
                      summary = clean(description)
                  image = page_image or image
              except Exception as error:
                  print("Metadata unavailable:", publisher, type(error).__name__)

              extra_key = fingerprint(title)
              url_key = fingerprint(canonical(original))
              topic = topic or topic_key(title, summary)
              if extra_key in seen or url_key in seen or fingerprint(original) in seen or (topic and topic in topics):
                  continue
              if not image or not public_url(image) or not useful_summary(summary, title, publisher) or is_google(original):
                  print("Skip incomplete:", publisher, "image=", bool(image), "description=", useful_summary(summary, title, publisher))
                  continue
              print("Ready:", publisher, "image=yes description=yes")

              embed = {
                  "title": title[:250],
                  "url": original,
                  "description": summary[:500] or "Consulta el artículo original.",
                  "color": 16744448,
                  "author": {"name": publisher[:200]},
                  "footer": {"text": "Metal Slug Unity • News Network"},
                  "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(stamp))
              }

              if image.startswith(("https://", "http://")):
                  embed["image"] = {"url": image}

              try:
                  response = requests.post(
                      webhook,
                      json={
                          "embeds": [embed],
                          "allowed_mentions": {"parse": []}
                      },
                      timeout=20
                  )

                  if response.status_code not in (200, 204):
                      print("Discord HTTP:", response.status_code)
                      break

              except requests.RequestException:
                  print("Discord connection error")
                  break

              seen.update([key, extra_key, url_key])
              state.write_text(json.dumps(sorted(seen), indent=2))
              if topic:
                  topics[topic] = time.time()
                  topic_state.write_text(json.dumps(topics, indent=2))
              sent += 1
              time.sleep(3)

          print("Published:", sent)
          PY
      - name: Save published history
        if: always()
        run: |
          git config user.name "MSU News Engine"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in published.json published_topics.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update news history"
            git push
          fi
